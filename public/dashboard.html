<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftowave | Your Studio Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #c46d4d; --teal: #2f6f73; --bg: #fffaf3; --text: #181818; --muted: #70685f; --line: #eadfd1; }
        * { box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; padding: 42px 6vw; margin: 0; background: var(--bg); color: var(--text); }
        a { color: inherit; text-decoration: none; }
        .back-link { color: var(--accent); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
        .profile-section {
            background: #fff;
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 22px;
            margin: 26px 0 44px;
        }
        .profile-img { width: 78px; height: 78px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        .profile-details h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: clamp(30px, 5vw, 48px); }
        .profile-details p { margin: 6px 0 0; color: var(--muted); }
        .orders-header { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 20px; }
        .orders-header h2 { font-family: 'Playfair Display', serif; font-size: 32px; margin: 0; }
        .order-card {
            background: #fff;
            padding: 24px;
            margin-bottom: 18px;
            border: 1px solid var(--line);
            border-left: 5px solid var(--accent);
            border-radius: 8px;
        }
        .order-top { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
        .order-top h3 { margin: 0; font-family: 'Playfair Display', serif; font-size: 25px; }
        .status-badge {
            background: #eef7f6;
            color: var(--teal);
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            white-space: nowrap;
        }
        .meta { color: var(--muted); font-size: 13px; line-height: 1.7; }
        .custom-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin: 18px 0;
        }
        .custom-box {
            background: #fff8ef;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            min-height: 82px;
        }
        .custom-box span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 800; margin-bottom: 6px; }
        .custom-box strong { font-size: 13px; line-height: 1.45; }
        .timeline {
            display: grid;
            grid-template-columns: repeat(9, minmax(76px, 1fr));
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
        }
        .timeline-step {
            border-top: 3px solid #dfd2c5;
            padding-top: 8px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.35;
            font-weight: 700;
        }
        .timeline-step.done { border-color: var(--teal); color: var(--text); }
        .empty {
            text-align: center;
            padding: 56px 20px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: #fff;
        }
        .empty p { color: var(--muted); }
        @media (max-width: 760px) {
            .profile-section, .order-top, .orders-header { flex-direction: column; align-items: flex-start; }
            .custom-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">Back to Studio</a>

    <div id="user-profile" class="profile-section"></div>

    <div class="orders-header">
        <div>
            <h2>Order Studio</h2>
            <p class="meta">Track your custom magazine from order placement to delivery.</p>
        </div>
        <a class="back-link" href="index.html#studio">Create another magazine</a>
    </div>
    <div id="orders-list">Connecting to vault...</div>

    <script>
        const orderStatuses = [
            'Order Placed',
            'Photos Received',
            'Designing',
            'Preview Sent',
            'Customer Approved',
            'Printing',
            'Packed',
            'Shipped',
            'Delivered'
        ];

        function normalizeCustomization(customization) {
            if (Array.isArray(customization)) return customization[0] || {};
            return customization || {};
        }

        function renderTimeline(status) {
            const activeIndex = Math.max(orderStatuses.indexOf(status), 0);
            return `
                <div class="timeline">
                    ${orderStatuses.map((step, index) => `<div class="timeline-step ${index <= activeIndex ? 'done' : ''}">${step}</div>`).join('')}
                </div>
            `;
        }

        async function initDashboard() {
            const token = localStorage.getItem('gt_token');
            const user = JSON.parse(localStorage.getItem('gt_user'));

            if (!token || !user) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('user-profile').innerHTML = `
                <img src="${user.picture}" class="profile-img" alt="Profile">
                <div class="profile-details">
                    <h1>${user.name}</h1>
                    <p>${user.email}</p>
                    <span style="font-size: 11px; color: var(--accent); font-weight: 800; letter-spacing: 1px; text-transform: uppercase;">Premium Member</span>
                </div>
            `;

            try {
                const res = await fetch('/api/user/orders', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const orders = await res.json();
                const list = document.getElementById('orders-list');

                if (!Array.isArray(orders) || orders.length === 0) {
                    list.innerHTML = `
                        <div class="empty">
                            <p>No curations found in your vault.</p>
                            <a href="index.html#studio" class="back-link" style="color: var(--text);">Start Creating</a>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = orders.map(order => {
                    const custom = normalizeCustomization(order.customization);
                    return `
                        <article class="order-card">
                            <div class="order-top">
                                <div>
                                    <h3>${order.product}</h3>
                                    <p class="meta">Ordered on ${new Date(order.date).toLocaleDateString()} - ${order.amount || 0} INR</p>
                                </div>
                                <div class="status-badge">${order.status || 'Order Placed'}</div>
                            </div>
                            <div class="custom-grid">
                                <div class="custom-box"><span>Recipient</span><strong>${custom.recipientName || 'Not added'}</strong></div>
                                <div class="custom-box"><span>Occasion</span><strong>${custom.occasion || 'Custom gift'}</strong></div>
                                <div class="custom-box"><span>Style</span><strong>${custom.template || order.product}</strong></div>
                                <div class="custom-box"><span>Photos</span><strong>${custom.photoCount || 0} uploaded in preview</strong></div>
                            </div>
                            ${renderTimeline(order.status || 'Order Placed')}
                        </article>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById('orders-list').innerHTML = '<p class="meta">Error loading orders. Please refresh.</p>';
            }
        }

        initDashboard();
    </script>
</body>
</html>
